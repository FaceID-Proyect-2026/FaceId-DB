      labels: "BD-01-dev,ddl,base,security"
      comment: Creates the credential table for storing user authentication credentials.
      changes:
        - sqlFile:
            path: 002_credential.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/002_credential.rollback.sql
            relativeToChangelogFile: true
